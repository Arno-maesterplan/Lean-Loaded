<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lean & Loaded 💪</title>
<link rel="manifest" href="manifest.json">
<!-- PWA / Apple -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lean&amp;Loaded">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#22883a">
<meta name="description" content="Low cal · High protein · Belgisch. Arno's persoonlijk kookboek.">
<style>
:root{
  --green:#2d6a4f;--gl:#52b788;--gp:#d8f3dc;
  --bg:#f6f8f6;--card:#fff;--text:#1a1f1a;--muted:#6b7a6b;
  --border:#e0e8e0;--shadow:0 2px 14px rgba(45,106,79,.09);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);}

/* ── HEADER ── */
header{background:var(--green);color:#fff;padding:18px 20px 14px;position:sticky;top:0;z-index:200;box-shadow:0 2px 10px rgba(0,0,0,.2);}
header h1{font-size:1.35rem;font-weight:800;letter-spacing:-.3px;}
header p{font-size:.78rem;opacity:.75;margin-top:2px;}
.hstats{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;}
.hstat{font-size:.72rem;background:rgba(255,255,255,.18);padding:3px 9px;border-radius:20px;}

/* ── CONTROLS ── */
.ctrl{background:#fff;border-bottom:1px solid var(--border);padding:12px 16px 10px;}
.swrap{position:relative;margin-bottom:9px;}
.swrap input{width:100%;padding:9px 12px 9px 36px;border:1.5px solid var(--border);border-radius:10px;font-size:.88rem;outline:none;}
.swrap input:focus{border-color:var(--gl);}
.si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.9rem;}
.frow{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.frow::-webkit-scrollbar{display:none;}
.fbtn{flex-shrink:0;padding:5px 12px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:.76rem;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap;transition:all .13s;}
.fbtn.active{background:var(--green);border-color:var(--green);color:#fff;}

/* ── INGREDIENT FILTER ── */
.ing-filter{background:#1b4332;border-bottom:2px solid #0a2e1f;padding:12px 16px;overflow:visible;position:relative;z-index:100;}
.ing-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;}
.ing-title{font-size:.82rem;font-weight:700;color:#fff;}
.ing-toggle{font-size:.73rem;color:rgba(255,255,255,.6);}
.ing-clear{font-size:.72rem;color:rgba(255,255,255,.6);cursor:pointer;text-decoration:underline;margin-top:8px;display:inline-block;}
.ing-body{display:none;overflow:visible;}
.ing-body.open{display:block;}
.ing-search-wrap{position:relative;margin-top:10px;}
.ing-search-wrap input{
  width:100%;padding:10px 14px 10px 38px;
  border:2px solid rgba(255,255,255,.3);border-radius:10px;
  font-size:.88rem;outline:none;background:rgba(255,255,255,.12);
  color:#fff;
}
.ing-search-wrap input::placeholder{color:rgba(255,255,255,.55);}
.ing-search-wrap input:focus{border-color:#52b788;background:rgba(255,255,255,.18);}
.ing-search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:.9rem;pointer-events:none;}
.ing-hint{font-size:.72rem;color:rgba(255,255,255,.5);margin-top:5px;}
.ing-dropdown{
  position:absolute;top:calc(100% + 4px);left:0;right:0;
  background:#fff;border:2px solid var(--green);
  border-radius:10px;z-index:9999;
  max-height:200px;overflow-y:auto;
  display:none;box-shadow:0 8px 24px rgba(0,0,0,.25);
}
.ing-dropdown.open{display:block;}
.ing-opt{padding:9px 14px;font-size:.85rem;cursor:pointer;color:var(--text);border-bottom:1px solid var(--bg);}
.ing-opt:last-child{border-bottom:none;}
.ing-opt:hover,.ing-opt.hi{background:var(--gp);color:var(--green);font-weight:700;}
.ing-selected{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;}
.ing-sel-chip{padding:5px 10px 5px 12px;border-radius:20px;background:#52b788;color:#fff;font-size:.78rem;font-weight:700;display:flex;align-items:center;gap:6px;}
.ing-sel-chip .rm{cursor:pointer;font-size:1rem;line-height:1;opacity:.8;font-weight:400;}
.ing-sel-chip .rm:hover{opacity:1;}

/* ── SORT ── */
.srow{display:flex;gap:7px;align-items:center;padding:7px 16px;border-bottom:1px solid var(--border);background:var(--bg);}
.slbl{font-size:.73rem;color:var(--muted);}
.sbtn{padding:3px 10px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:.73rem;cursor:pointer;color:var(--muted);transition:all .13s;}
.sbtn.active{background:var(--gp);border-color:var(--gl);color:var(--green);font-weight:700;}

/* ── GRID ── */
.rinfo{padding:7px 16px 3px;font-size:.73rem;color:var(--muted);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;padding:12px 16px 80px;}

/* ── CARD ── */
.card{background:var(--card);border-radius:16px;border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;transition:transform .15s,box-shadow .15s;}
.card:hover{transform:translateY(-2px);box-shadow:0 7px 22px rgba(45,106,79,.14);}

/* Card body */
.ch{padding:12px 14px 10px;}
.ccat{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.ctitle{font-size:.93rem;font-weight:800;line-height:1.3;}
.cmacros{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
.pill{padding:3px 8px;border-radius:20px;font-size:.7rem;font-weight:700;}
.pcal{background:#fff3e0;color:#e65100;}
.pprot{background:var(--gp);color:var(--green);}
.pprep{background:#e8eaff;color:#3949ab;}
.pwarn{background:#fff3e0;color:#bf360c;font-size:.68rem;}
.vid-badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;font-size:.7rem;padding:2px 6px;border-radius:20px;backdrop-filter:blur(4px);}
.ch{position:relative;}
.ig-tile{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);border-radius:14px;padding:3px;cursor:pointer;text-decoration:none;display:block;margin-bottom:8px;}
.ig-tile-inner{background:#1a1a2e;border-radius:11px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;color:#fff;}
.ig-tile-inner svg{width:36px;height:36px;fill:#fff;}
.ig-tile-label{font-size:.95rem;font-weight:600;letter-spacing:.01em;}
.ig-tile-sub{font-size:.75rem;opacity:.7;}
.novid-filter{background:#f5f5f5;border:1.5px dashed #ccc;color:#888;}
.hbtn{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-size:.82rem;cursor:pointer;transition:all .2s;}
.hbtn.active{background:var(--green);color:#fff;border-color:var(--green);}
.hclean{background:#d4edda;color:#155724;font-size:.68rem;}
.hgood{background:#fff3cd;color:#856404;font-size:.68rem;}
.htreat{background:#fde;color:#c0392b;font-size:.68rem;}
.prating{background:#fff8e1;color:#f59e0b;font-size:.75rem;letter-spacing:1px;}
.ptm{background:#e8f5e9;color:#1b5e20;font-weight:700;}
.star{cursor:pointer;font-size:1.4rem;color:#ddd;transition:color .15s;}
.star.on{color:#f59e0b;}
.star:hover{color:#f59e0b;}
.stars-wrap{display:flex;gap:2px;margin-top:6px;}
.rating-row{margin-top:8px;}
.rating-note{width:100%;margin-top:8px;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:.82rem;font-family:inherit;resize:vertical;min-height:60px;background:var(--bg);color:var(--text);box-sizing:border-box;}


/* Expand */
.cexp{display:none;border-top:1px solid var(--border);}
.cexp.open{display:block;}
.cei{padding:14px;}
.esec{margin-bottom:12px;}
.esec h4{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px;}
.ings{list-style:none;}
.ings li{font-size:.83rem;padding:4px 0;border-bottom:1px solid var(--bg);display:flex;gap:8px;align-items:baseline;line-height:1.4;}
.ings li:last-child{border-bottom:none;}
.iamt{font-weight:800;color:var(--green);min-width:88px;flex-shrink:0;font-size:.78rem;}
.steps{list-style:none;counter-reset:s;}
.steps li{font-size:.83rem;padding:5px 0 5px 27px;position:relative;counter-increment:s;border-bottom:1px solid var(--bg);line-height:1.45;}
.steps li:last-child{border-bottom:none;}
.steps li::before{content:counter(s);position:absolute;left:0;top:6px;width:19px;height:19px;background:var(--green);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:800;}
.scale-btn{background:var(--accent);border:none;color:#fff;width:24px;height:24px;border-radius:50%;font-size:15px;cursor:pointer;line-height:1;padding:0;font-weight:700;}
.scale-btn:hover{opacity:.85;}
.scale-disp{display:inline-block;min-width:26px;text-align:center;font-weight:700;font-size:.88rem;}
.cpybtn{width:100%;padding:10px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:.83rem;font-weight:700;cursor:pointer;margin-top:10px;transition:background .15s;}
.cpybtn:hover{background:#1b4332;}
.cpybtn.ok{background:var(--gl);}
.note{font-size:.77rem;color:var(--muted);font-style:italic;padding:6px 9px;background:var(--gp);border-radius:7px;margin-top:5px;line-height:1.4;}
.btip{font-size:.77rem;color:#7b3c00;background:#fff3e0;padding:6px 9px;border-radius:7px;margin-top:5px;line-height:1.4;}

/* ── VIDEO ── */
.vid-section{margin-top:12px;}
.vid-add-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border:1.5px dashed var(--border);border-radius:8px;background:#fff;color:var(--muted);font-size:.78rem;cursor:pointer;transition:all .13s;}
.vid-add-btn:hover{border-color:var(--gl);color:var(--green);}
.vid-thumb-wrap{position:relative;border-radius:10px;overflow:hidden;cursor:pointer;line-height:0;}
.vid-thumb{width:100%;display:block;border-radius:10px;}
.vid-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.55);color:#fff;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.3rem;pointer-events:none;}
.vid-edit-bar{display:flex;justify-content:flex-end;gap:6px;margin-top:5px;}
.vid-edit-btn{padding:4px 10px;border:1.5px solid var(--border);border-radius:7px;background:#fff;font-size:.72rem;cursor:pointer;color:var(--muted);}
.vid-edit-btn:hover{border-color:var(--gl);color:var(--green);}
.vid-del-btn{padding:4px 10px;border:none;border-radius:7px;background:#ffebee;font-size:.72rem;cursor:pointer;color:#c62828;}
.vid-link-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;background:var(--green);color:#fff;border-radius:9px;font-size:.83rem;font-weight:700;text-decoration:none;transition:background .13s;}
.vid-link-btn:hover{background:#1b4332;}
.vid-input-wrap input{width:100%;padding:8px 11px;border:1.5px solid var(--gl);border-radius:9px;font-size:.83rem;outline:none;margin-top:6px;}
.vid-input-row{display:flex;gap:6px;margin-top:7px;}

/* Category colors */
.cat-m{color:#c62828;}.cat-o{color:#e65100;}.cat-s{color:#1565c0;}.cat-z{color:#6a1b9a;}.cat-ss{color:#00695c;}

@media(max-width:600px){.grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<header>
  <h1>💪 Lean &amp; Loaded</h1>
  <p>Low calorie · High protein · Belgische supermarkt</p>
  <div class="hstats">
    <span class="hstat" id="hcount">213 recepten</span>
    <span class="hstat">🇧🇪 BE-proof</span>
    <span class="hstat">Laag in calorieën</span>
  </div>
</header>

<div class="ctrl">
  <div class="swrap">
    <span class="si">🔍</span>
    <input type="text" id="search" placeholder="Zoek recept of ingrediënt..." oninput="render()">
  </div>
  <div class="frow">
    <button class="fbtn active" onclick="setF('all',this)">Alles</button>
    <button class="fbtn" onclick="setF('maaltijd',this)">🍽️ Maaltijden</button>
    <button class="fbtn" onclick="setF('ontbijt',this)">🍳 Ontbijt</button>
    <button class="fbtn" onclick="setF('snack',this)">🥪 Snacks</button>
    <button class="fbtn" onclick="setF('lunch',this)">🥗 Lunch</button>
    <button class="fbtn" onclick="setF('zoet',this)">🍫 Zoet</button>
    <button class="fbtn" onclick="setF('saus',this)">🥫 Sauzen</button>
    <button class="fbtn novid-filter" onclick="setF('novid',this)">📵 Zonder video</button>
    <button class="fbtn" onclick="setF('thermomix',this)">🌀 Thermomix</button>
  </div>
  <div class="frow" style="margin-top:6px">
    <button class="hbtn active" onclick="setH(0,this)">Alle</button>
    <button class="hbtn" onclick="setH(1,this)">💚 Clean</button>
    <button class="hbtn" onclick="setH(2,this)">🟡 Goed</button>
    <button class="hbtn" onclick="setH(3,this)">🔴 Treat</button>
    <button class="hbtn" onclick="setH(-1,this)" style="border-style:dashed">⭐ Beoordeeld</button>
  </div>
</div>

<div class="ing-filter">
  <div class="ing-header" onclick="toggleIngFilter()">
    <span class="ing-title">🧺 Filter op wat je in huis hebt</span>
    <span class="ing-toggle" id="ing-arrow">▲ verberg</span>
  </div>
  <div class="ing-body open" id="ing-body">
    <div class="ing-search-wrap">
      <span class="ing-search-icon">🔎</span>
      <input type="text" id="ing-input" placeholder="bv. kipfilet, eieren, havermout…" autocomplete="off">
      <div class="ing-dropdown" id="ing-dropdown"></div>
    </div>
    <div class="ing-hint">Klik een ingredient aan om het te selecteren. Meerdere = recepten met álle ingredients.</div>
    <div class="ing-selected" id="ing-selected"></div>
    <span class="ing-clear" id="ing-clear" onclick="clearIngs()" style="display:none">× Alles wissen</span>
  </div>
</div>

<div class="srow">
  <span class="slbl">Sorteer:</span>
  <button class="sbtn active" id="sc" onclick="setS('cal')">↑ Calorieën</button>
  <button class="sbtn" id="sp" onclick="setS('prot')">↓ Proteïne</button>
  <button class="sbtn" id="sa" onclick="setS('abc')">A–Z</button>
</div>
<div class="srow">
  <span class="slbl">⏱️ Bereidingstijd:</span>
  <button class="sbtn active" id="t0" onclick="setT(0)">Alles</button>
  <button class="sbtn" id="t15" onclick="setT(15)">≤ 15 min</button>
  <button class="sbtn" id="t30" onclick="setT(30)">≤ 30 min</button>
  <button class="sbtn" id="t45" onclick="setT(45)">≤ 45 min</button>
  <button class="sbtn" id="t60" onclick="setT(60)">≤ 60 min</button>
</div>
<div class="rinfo" id="rinfo"></div>
<div class="grid" id="grid"></div>

<script>
const INGS = [
  'Griekse yoghurt','Eieren','Kipfilet','Havermout',
  'Banaan','Zoete aardappel','Proteïnepoeder','Cacao / chocolade',
  'Pindakaas','Tonijn','Mozzarella','Bloem'
];

const R = [
// ══════════════ MAALTIJDEN ══════════════
{id:1,cat:'maaltijd',lbl:'🍽️ Maaltijd',title:'Chicken Fettuccine Alfredo',
 cal:495,prot:73,fat:8,carbs:25,srv:'8 porties',time:'~35 min',prep:true,

 tags:['Kipfilet','Griekse yoghurt','Mozzarella'],
 note:'Ideaal om op zondag in bulk te maken — 8 porties voor de hele week.',
 btip:'Banza-pasta bestaat niet in België. Gebruik gewone fettuccine of volkoren variant (Barilla). Gecondenseerde melk ongezoet = Nestlé Carnation in het wit blik (Colruyt/Delhaize). Philadelphia light in elke supermarkt.',
 ings:[
  ['1,8 kg','kipfilet, in blokjes'],
  ['450 g','fettuccine (volkoren of gewone, Barilla)'],
  ['400 ml','gecondenseerde melk ongezoet (Nestlé Carnation — wit blik, Colruyt/Delhaize)'],
  ['175 g','Philadelphia light'],
  ['225 g','Griekse yoghurt 0%'],
  ['80 g','geraspte Parmezaan'],
  ['1 grote','witte ui, fijn gesneden'],
  ['1½ el','knoflook uit een potje of vers geperst'],
  ['kruiden kip:','1 el gerookte paprika + 1 el Italiaanse kruiden + 1 el knoflookpoeder + zout'],
  ['2 tl','olijfolie'],
 ],

 ]},
{id:2,cat:'maaltijd',lbl:'🍽️ Maaltijd',title:'Protein Pizza (BBQ kip)',

 ],

  ['naar smaak','augurken'],
  ['230 g','rundergehakt 5% vet'],
  ['kruiden:','1 tl zout + 1 tl peper + 1 tl paprika + 1 tl knoflookpoeder + 1 tl uienpoeder'],
  ['Big Mac saus:','75 g Griekse yoghurt 0% + 2 el Heinz 0% ketchup + 1½ el fijngehakte augurk + 2 tl mosterd + kruiden'],
 ],
 steps:[
  'Meng het gehakt met de kruiden. Maak de Big Mac saus en zet in de koelkast.',

  'Stapel alles op: brood, saus, ui, burgers, spek, augurken, saus, brood.',
 ]},
{id:4,cat:'maaltijd',lbl:'🍽️ Maaltijd',title:'Sweet Potato Hummus Bowl',
 cal:578,prot:43,fat:12,carbs:76,srv:'1 portie',time:'~50 min oven / ~25 min airfryer',prep:false,
 emoji:'🍠',img:'sweet+potato,bowl,healthy,hummus',bg:'bg-m',
 tags:['Kipfilet','Zoete aardappel','Mozzarella'],
 note:'Smaakt als iets van een restaurantje. Rode bietjeshummus is hier de sleutel.',

 ings:[
  ['300 g','zoete aardappel'],
  ['80 g','gekookte kipfilet'],
  ['20 g','mozzarella light'],
  ['80 g','salade van komkommer, tomaat en ui'],
  ['50 g','rode bietjeshummus (kant-en-klaar, Colruyt/Delhaize)'],
  ['15 g','Nando\'s peri-peri mayo of sriracha mayo light'],
  ['kruiden:','zout, peper, knoflookpoeder, paprika, chilivlokken'],
 ],
 steps:[

}

function ingKey(e){
  const dd=document.getElementById('ing-dropdown');
  const opts=[...dd.querySelectorAll('.ing-opt[data-val]')];
  if(!opts.length)return;
  if(e.key==='ArrowDown'){e.preventDefault();ingHiIdx=Math.min(ingHiIdx+1,opts.length-1);}
  else if(e.key==='ArrowUp'){e.preventDefault();ingHiIdx=Math.max(ingHiIdx-1,0);}
  else if(e.key==='Enter'){e.preventDefault();if(ingHiIdx>=0)doSelect(opts[ingHiIdx].dataset.val);else if(opts.length===1)doSelect(opts[0].dataset.val);return;}
  else if(e.key==='Escape'){dd.classList.remove('open');return;}
  opts.forEach((o,i)=>o.classList.toggle('hi',i===ingHiIdx));
  if(ingHiIdx>=0)opts[ingHiIdx].scrollIntoView({block:'nearest'});
}

  selIngs.add(val);
  document.getElementById('ing-input').value='';
  document.getElementById('ing-dropdown').classList.remove('open');
  document.getElementById('ing-dropdown').innerHTML='';
  ingHiIdx=-1;

// ── SERVING SCALER ────────────────────────────────────────────
// SCALE[id] = gewenst aantal porties (default = recept's eigen srv-aantal)
const SCALE={};
function srvNum(r){
  if(typeof r.srv==='number')return r.srv;
  // Haal getal uit string: '8 porties', 'per stuk (8 stuks)', '1 portie (recept = 4)'
  const p=r.srv.match(/\(\s*(?:recept\s*=\s*)?(\d+)\s*(?:stuks?|porties?|muffins?|wafels?|rollen?|koekjes?|stukjes?|sneden?|el)?\s*\)/i);
  if(p)return parseInt(p[1]);
  const d=r.srv.match(/^(\d+)/);
  return d?parseInt(d[1]):1;
}
function srvUnit(r){
  if(typeof r.srv!=='number'){
    const s=r.srv.toLowerCase();
    if(s.includes('muffin'))return'muffins';
    if(s.includes('wafel'))return'wafels';
    if(s.includes('koekje'))return'koekjes';
    if(s.includes('stuk'))return'stuks';
    if(s.includes('snede')||s.includes('snee'))return'sneden';
    if(s.includes('wrap'))return'wraps';
    if(s.includes('rol'))return'rollen';
    if(s.includes('portie'))return'porties';
  }
  const n=SCALE[r.id]!==undefined?SCALE[r.id]:srvNum(r);
  return n===1?'portie':'porties';
}
function srvLabel(r){
  const n=srvNum(r);
  return n+' '+srvUnit(r);
}
function fmtNum(n){
  if(n===0)return'0';
  if(n===Math.round(n))return n.toString();
  const fracs=[[0.5,'½'],[0.25,'¼'],[0.75,'¾'],[1/3,'⅓'],[2/3,'⅔']];
  for(const[v,sym]of fracs){
    if(Math.abs(n-Math.floor(n)-v)<0.05)return(Math.floor(n)>0?Math.floor(n):'')+sym;
  }
  return n<10?(Math.round(n*10)/10).toString():Math.round(n).toString();
}
function scaleAmt(amt,f){
  if(Math.abs(f-1)<0.001)return amt;
  const s=amt.trim();
  const frac={'½':0.5,'¼':0.25,'¾':0.75,'⅓':1/3,'⅔':2/3};
  const m=s.match(/^(\d+)?\s*(½|¼|¾|⅓|⅔)?\s*(.*)$/);
  if(m&&(m[1]||m[2])){
    let num=(parseInt(m[1]||0))+(frac[m[2]]||0);
    if(!num)return amt;
    return fmtNum(num*f)+(m[3]?' '+m[3].trim():'');
  }
  const nm=s.match(/^(\d+(?:[.,]\d+)?)\s*(.*)/);
  if(!nm)return amt;
  const num=parseFloat(nm[1].replace(',','.'));
  return fmtNum(num*f)+(nm[2]?' '+nm[2].trim():'');
}
function changeScale(id,delta){
  const r=R.find(x=>x.id===id);
  const base=srvNum(r);
  const cur=SCALE[id]!==undefined?SCALE[id]:base;
  const next=Math.max(1,cur+delta);
  SCALE[id]=next;
  const factor=next/base;
  // Update ingrediënten
  const el=document.getElementById('ings-'+id);
  if(el)el.innerHTML=r.ings.map(i=>`<li><span class="iamt">${scaleAmt(i[0],factor)}</span>${i[1]||''}</li>`).join('');
  // Update teller
  const sd=document.getElementById('scale-disp-'+id);
  if(sd)sd.textContent=next+' '+srvUnit(r);
}

        ${nt}${bt}
        <div class="esec" style="margin-top:12px">
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:6px">
            <h4 style="margin:0">🛒 Ingrediënten</h4>
            <div style="display:flex;align-items:center;gap:6px;font-size:.82rem">
              <span style="color:var(--muted)">Porties:</span>
              <button class="scale-btn" onclick="changeScale(${r.id},-1)">−</button>
              <span id="scale-disp-${r.id}" class="scale-disp">${srvLabel(r)}</span>
              <button class="scale-btn" onclick="changeScale(${r.id},+1)">+</button>
            </div>
          </div>
          <ul class="ings" id="ings-${r.id}">${r.ings.map(i=>`<li><span class="iamt">${i[0]}</span>${i[1]||''}</li>`).join('')}</ul>
        </div>
        <div class="esec">
          <h4>📋 Bereiding</h4>
          <ol class="steps">${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
        </div>
        <div class="vid-section esec" onclick="event.stopPropagation()">
          <h4>🎥 Video</h4>
          <div id="vid-section-${r.id}">${renderVideoSection(r.id)}</div>
        </div>
        <div class="rating-row esec" onclick="event.stopPropagation()">
          <h4>⭐ Jouw beoordeling</h4>
          <div id="stars-${r.id}" class="stars-wrap">${starsHtml(r.id)}</div>
          <textarea id="note-${r.id}" class="rating-note" placeholder="Optioneel: notitie toevoegen…" onclick="event.stopPropagation()" oninput="saveNote(${r.id},this.value)">${ratingNote(r.id)}</textarea>
        </div>
        <button class="cpybtn" id="b${r.id}" onclick="cpy(event,${r.id})">📋 Kopieer boodschappenlijst</button>
      </div>
    </div>
  </div>`;
}

function tog(id){
  const x=document.getElementById(`x${id}`);
  if(!x)return;
  const was=x.classList.contains('open');
  if(open&&open!==id){const px=document.getElementById(`x${open}`);if(px)px.classList.remove('open');}
  x.classList.toggle('open',!was);
  open=was?null:id;
  if(!was)setTimeout(()=>{const c=document.getElementById(`c${id}`);if(c)c.scrollIntoView({behavior:'smooth',block:'nearest'});},50);
}
function cpy(e,id){
  e.stopPropagation();
  const r=R.find(x=>x.id===id);
  const base=srvNum(r);
  const cur=SCALE[id]!==undefined?SCALE[id]:base;
  const f=cur/base;
  const fLabel=cur!==base?` (voor ${cur} ${srvUnit(r)})`:'';
  const txt=`🛒 Boodschappenlijst — ${r.title}${fLabel}\n\n`+r.ings.map(i=>`• ${scaleAmt(i[0],f)} ${i[1]||''}`).join('\n');
  navigator.clipboard.writeText(txt).then(()=>{
    const b=document.getElementById(`b${id}`);
    b.textContent='✅ Gekopieerd!';b.classList.add('ok');
    setTimeout(()=>{b.innerHTML='📋 Kopieer boodschappenlijst';b.classList.remove('ok');},2000);
  });
}
// ── VIDEO LINKS ───────────────────────────────────────────────
const videoURLs=JSON.parse(localStorage.getItem('kookboek_videos')||'{}');

function ytId(url){
  const m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([^&\s?#]+)/);
  return m?m[1]:null;
}
function vidPlatform(url){
  if(url.includes('instagram.com'))return'Instagram';
  if(url.includes('tiktok.com'))return'TikTok';
  if(url.includes('youtu'))return'YouTube';
  return'Video';
}
function renderVideoSection(id){
  const r=R.find(x=>x.id===id);
  const url=(id in videoURLs)?videoURLs[id]:((r&&r.link)||null);
  if(!url){
    return`<button class="vid-add-btn" onclick="showVidInput(${id})">🎥 Video toevoegen</button>`;
  }
  const yt=ytId(url);
  if(yt){
    return`<div>
      <a href="${url}" target="_blank" class="vid-thumb-wrap">
        <img src="https://img.youtube.com/vi/${yt}/hqdefault.jpg" class="vid-thumb" alt="Video preview">
        <div class="vid-play">▶</div>
      </a>
      <div class="vid-edit-bar">
        <button class="vid-edit-btn" onclick="showVidInput(${id})">✏️ Wijzigen</button>
        <button class="vid-del-btn" onclick="delVideo(${id})">× Verwijderen</button>
      </div>
    </div>`;
  }
  const platform=vidPlatform(url);
  const tileHtml=platform==='Instagram'
    ?`<a href="${url}" target="_blank" class="ig-tile"><div class="ig-tile-inner">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
        <div class="ig-tile-label">Bekijk op Instagram</div>
        <div class="ig-tile-sub">Tik om de Reel te openen</div>
      </div></a>`
    :`<a href="${url}" target="_blank" class="vid-link-btn">▶ Bekijk op ${platform}</a>`;
  return`<div>${tileHtml}
    <div class="vid-edit-bar">
      <button class="vid-edit-btn" onclick="showVidInput(${id})">✏️ Wijzigen</button>
      <button class="vid-del-btn" onclick="delVideo(${id})">× Verwijderen</button>
    </div>
  </div>`;
}
function showVidInput(id){
  const sec=document.getElementById(`vid-section-${id}`);
  if(!sec)return;
  sec.innerHTML=`<div class="vid-input-wrap">
    <input type="url" id="vi-${id}" placeholder="Plak hier de URL (YouTube, Instagram, TikTok…)" value="${videoURLs[id]||''}">
    <div class="vid-input-row">
      <button class="cpybtn" style="flex:1;padding:8px" onclick="saveVideo(${id})">Opslaan</button>
      <button class="vid-edit-btn" onclick="cancelVid(${id})">Annuleer</button>
    </div>
  </div>`;
  document.getElementById(`vi-${id}`).focus();
  document.getElementById(`vi-${id}`).addEventListener('keydown',e=>{if(e.key==='Enter')saveVideo(id);});
}
function saveVideo(id){
  const inp=document.getElementById(`vi-${id}`);
  const url=inp?inp.value.trim():'';
  if(url)videoURLs[id]=url;else delete videoURLs[id];
  localStorage.setItem('kookboek_videos',JSON.stringify(videoURLs));
  const sec=document.getElementById(`vid-section-${id}`);
  if(sec)sec.innerHTML=renderVideoSection(id);
}
function delVideo(id){
  videoURLs[id]=null;
  localStorage.setItem('kookboek_videos',JSON.stringify(videoURLs));
  const sec=document.getElementById(`vid-section-${id}`);
  if(sec)sec.innerHTML=renderVideoSection(id);
}
function cancelVid(id){
  const sec=document.getElementById(`vid-section-${id}`);
  if(sec)sec.innerHTML=renderVideoSection(id);
}

function setF(c,el){filt=c;document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));el.classList.add('active');render();}
function setH(h,el){healthFilt=h;document.querySelectorAll('.hbtn').forEach(b=>b.classList.remove('active'));el.classList.add('active');render();}
function setS(t){sort=t;document.querySelectorAll('.sbtn').forEach(b=>b.classList.remove('active'));document.getElementById({cal:'sc',prot:'sp',abc:'sa'}[t]).classList.add('active');render();}
function setT(m){maxTime=m;['t0','t15','t30','t45','t60'].forEach(id=>document.getElementById(id).classList.remove('active'));document.getElementById('t'+(m||0)).classList.add('active');render();}
function parseTime(s){const m=s.match(/(\d+)/);return m?parseInt(m[1]):999;}

function render(){
  const q=document.getElementById('search').value.toLowerCase();
  let list=R.filter(r=>{
    if(filt==='novid'){const hv=(r.id in videoURLs)?!!videoURLs[r.id]:!!r.link;if(hv)return false;}
    else if(filt==='lunch'){if(!r.tags.includes('lunch'))return false;}
    else if(filt!=='all'&&r.cat!==filt)return false;
    if(healthFilt===-1&&!ratings[r.id])return false;
    else if(healthFilt>0&&(HEALTH[r.id]||0)!==healthFilt)return false;
    if(q&&!r.title.toLowerCase().includes(q)&&!r.tags.some(t=>t.toLowerCase().includes(q))&&!r.ings.some(i=>(i[0]+' '+(i[1]||'')).toLowerCase().includes(q))&&![...RECIPE_CANONS[r.id]].some(c=>c.toLowerCase().includes(q)))return false;
    if(selIngs.size>0&&![...selIngs].every(si=>RECIPE_CANONS[r.id].has(si)))return false;
    if(maxTime>0&&r.time>maxTime)return false;
    return true;
  });
  if(sort==='cal')list.sort((a,b)=>a.cal-b.cal);
  else if(sort==='prot')list.sort((a,b)=>b.prot-a.prot);
  else list.sort((a,b)=>a.title.localeCompare(b.title));
  document.getElementById('rinfo').textContent=`${list.length} recept${list.length!==1?'en':''} gevonden`;
  document.getElementById('grid').innerHTML=list.length
    ?list.map(card).join('')
    :`<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)"><div style="font-size:3rem">🥗</div><p>Geen recepten gevonden voor deze combinatie.</p></div>`;
}

render();

// ── SCALE BUTTON EVENT DELEGATION ────────────────────────────
document.addEventListener('click', function(e){
  const btn = e.target.closest('[data-scale]');
  if(!btn) return;
  e.stopPropagation();
  const id = parseInt(btn.dataset.scale);
  const delta = parseInt(btn.dataset.delta);
  changeScale(id, delta);
}, true); // capture phase: fires before card's onclick

// ── SERVICE WORKER ────────────────────────────────────────────
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        nw.addEventListener('statechange', () => {
          if(nw.state === 'installed' && navigator.serviceWorker.controller){
            // New version available — show subtle toast
            const t = document.createElement('div');
            t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#22883a;color:#fff;padding:10px 20px;border-radius:20px;font-size:.85rem;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.2)';
            t.textContent='🔄 Update beschikbaar — herlaad de app';
            document.body.appendChild(t);
            setTimeout(()=>t.remove(), 5000);
          }
        });
      });
    });
  });
}
</script>
</body>
</html>
